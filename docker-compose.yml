version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./sample_data:/sample_data
    environment:
      - DATABASE_URL=sqlite:////app/medikiosk.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FACILITATOR_URL=${FACILITATOR_URL:-https://facilitator.goplausible.xyz}
      - ENVIRONMENT=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
